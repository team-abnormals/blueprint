plugins {
    id "java-library"
    id "idea"
    id "maven-publish"
    id "net.neoforged.gradle.userdev" version "7.0.182"
}

version = "${project.mc_version}-${project.mod_version}"
group = "com.teamabnormals"

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft.accessTransformers.file rootProject.file("src/main/resources/META-INF/accesstransformer.cfg")

runs {
    configureEach {
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "debug"
        systemProperty "blueprint.indev", "true"
    }

    client {
        modSources {
            add project.sourceSets.main
            add "blueprint_test", project.sourceSets.test
        }
    }

    server {
        modSources {
            add project.sourceSets.main
            add "blueprint_test", project.sourceSets.test
        }
    }

    data {
        modSources {
            add project.sourceSets.main
            add "blueprint_test", project.sourceSets.test
        }
        programArguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()
        // programArguments.addAll "--mod", "blueprint_test", "--all", "--output", file("src/generated_test/resources/").getAbsolutePath(), "--existing", file("src/test/resources/").getAbsolutePath()
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}

sourceSets.test.resources {
    srcDir "src/generated_test/resources"
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge}"
}

subsystems {
    parchment {
        minecraftVersion = "${project.mc_version}"
        mappingsVersion = "${project.parchment}"
    }
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : project.mod_name,
                "Specification-Vendor"    : "Team Abnormals",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.mod_name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : "Team Abnormals",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named("test").configure {
    enabled = false
}

task sourcesJar(type: Jar) {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    archiveClassifier.set("sources")
    from sourceSets.main.allJava
}

artifacts {
    archives sourcesJar
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mod_version: mod_version, mc_version: mc_version, neoforge: neoforge]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = "abnormals"
            url = "https://maven.teamabnormals.com"
            credentials(PasswordCredentials)
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}