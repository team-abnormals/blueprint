buildscript {
    repositories {
        maven { url = "https://files.minecraftforge.net/maven" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    }
    dependencies {
        classpath group: "net.minecraftforge.gradle", name: "ForgeGradle", version: "6.0.46", changing: true
        classpath group: "org.spongepowered", name: "mixingradle", version: "0.7-SNAPSHOT"
    }
}

plugins {
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

apply plugin: "net.minecraftforge.gradle"
apply plugin: "eclipse"
apply plugin: "idea"
apply plugin: "maven-publish"
apply plugin: "org.spongepowered.mixin"

mixin {
    add sourceSets.main, "${project.mod_id}.refmap.json"
}

version = "${project.mc_version}-${project.mod_version}"
group = "com.teamabnormals"
archivesBaseName = project.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "official", version: "${project.mc_version}"
    accessTransformer = file("src/main/resources/META-INF/accesstransformer.cfg")
    runs {
        client {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            property "blueprint.indev", "true"
            arg "-mixin.config=" + project.mod_id + ".mixins.json"
            arg "-mixin.config=" + "blueprint_test.mixins.json"
            mods {
                blueprint {
                    source sourceSets.main
                }
                blueprint_test {
                    source sourceSets.test
                }
            }
        }
        server {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            property "blueprint.indev", "true"
            arg "-mixin.config=" + project.mod_id + ".mixins.json"
            arg "-mixin.config=" + "blueprint_test.mixins.json"
            mods {
                blueprint {
                    source sourceSets.main
                }
                blueprint_test {
                    source sourceSets.test
                }
            }
        }
        def blueprintDataArgs = [
                "--mod", project.mod_id,
                "--all",
                "--output", file("src/generated/resources/"),
                "--existing", file("src/main/resources")
        ]
        data {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"
            property "blueprint.indev", "true"
            args blueprintDataArgs
            mods {
                blueprint {
                    source sourceSets.main
                }
            }
        }
        testData {
            parent runs.data

            mods {
                blueprint_test {
                    source sourceSets.test
                }
            }

            afterEvaluate {
                //Weird trick, but forge test mods do it too
                args.removeAll {
                    blueprintDataArgs.contains(it instanceof File ? (it as File).absolutePath : it.toString())
                }
                args "--mod", "blueprint_test", "--all", "--output", file("src/generated_test/resources/"), "--existing", file("src/test/resources")
            }
        }
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}

sourceSets.test.resources {
    srcDir "src/generated_test/resources"
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.mc_version}-${project.forge}"

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : project.mod_name,
                "Specification-Vendor"    : "Team Abnormals",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.mod_name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : "Team Abnormals",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : project.mod_id + ".mixins.json"
        ])
    }
    finalizedBy "reobfJar"
}

task sourcesJar(type: Jar) {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    archiveClassifier.set("sources")
    from sourceSets.main.allJava
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = "abnormals"
            url = "https://maven.teamabnormals.com"
            credentials(PasswordCredentials)
        }
    }
}

publishMods {
    file = jar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file("changelog.md")).asText
    type = STABLE
    modLoaders.addAll("forge", "neoforge")
    version = project.mod_version
    displayName = "${project.mod_name} ${project.mc_version} - ${project.mod_version}"

    modrinth {
        announcementTitle = "<:modrinth:1428950505010364517> Download from Modrinth!"
        accessToken = providers.gradleProperty("MODRINTH_API_KEY")
        projectId = project.modrinth_id
        minecraftVersions.add(project.mc_version)
    }

    curseforge {
        announcementTitle = "<:curseforge:1428950488358850581> Download from CurseForge!"
        accessToken = providers.gradleProperty("CURSEFORGE_API_KEY")
        projectId = project.curseforge_id
        projectSlug = project.mod_id.replace('_', '-')
        minecraftVersions.add(project.mc_version)
    }

    discord() {
        webhookUrl = providers.gradleProperty("DISCORD_WEBHOOK")
        dryRunWebhookUrl = providers.gradleProperty("DISCORD_WEBHOOK_ALT")
        username = "Team Abnormals"
        content = changelog.map {
            "## ${project.mod_name} ${project.mc_version} - ${project.mod_version}\n" + it
        }
        style {
            look = "MODERN"
            thumbnailUrl = "https://i.slabfi.sh/icon_border/${project.mod_id}.png"
            color = "#537db5"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}